<!doctype HTML>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projet Système Embarqué</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-light p-2">
    <h2 class="text-center">Projet Système Embarqué - Domotique</h2>
    <hr/>

    <div class="row p-1">
      <div class="col-6">
        <h3 class="text-center">10 dernières actions</h3>
        <table class="table">
          <thead>
            <tr>
              <th>#</th>
              <th>Type</th>
              <th>Heure</th>
            </tr>
          </thead>
          <tbody id="last-actions">
          </tbody>
        </table>
      </div>
      <div class="col-6">
        <h3 class="text-center">Rapport des actions</h3>
        <canvas id="bar-chart-logs"></canvas>
      </div>
    </div>

    <div class="row mt-2 p-1">
      <div class="col-4"></div>
      <div class="col-4">
        <h3 class="text-center">Evolutions des actions</h3>
      </div>
      <div class="col-4">
        <select class="form-select" id="filter-select">
          <option id="day" selected>Ce jour</option>
          <option id="week">Cette semaine</option>
          <option id="month">Ce mois</option>
          <option id="year">Cette année</option>
          <option id="last_years">10 dernières années</option>
        </select>
      </div>
      <div class="col-6">
        <canvas id="log-line-chart-0"></canvas>
      </div>
      <div class="col-6">
        <canvas id="log-line-chart-1"></canvas>
      </div>
      <div class="col-6">
        <canvas id="log-line-chart-2"></canvas>
      </div>
      <div class="col-6">
        <canvas id="log-line-chart-3"></canvas>
      </div>
      <div class="col-6">
        <canvas id="log-line-chart-4"></canvas>
      </div>
      <div class="col-6">
        <canvas id="log-line-chart-5"></canvas>
      </div>
      <div class="col-6">
        <canvas id="log-line-chart-6"></canvas>
      </div>
      <div class="col-6">
        <canvas id="log-line-chart-7"></canvas>
      </div>
      <div class="col-12">
        <canvas id="logs-line-chart"></canvas>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js" integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.31.0/min/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js" integrity="sha512-WoViKhKD4qI2WruSZqv9+kvM4WfFhUMQCLN4QlDTt5aU56fLQy2gYoxWIqlEnXqJy/+Ac5q/hk1oWfqnMDhwMA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="/chartDateFilter.js"></script>
    <script src="/index.js"></script>
  </body>
</html>
